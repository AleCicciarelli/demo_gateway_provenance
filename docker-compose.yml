services:
  ollama:
    image: ollama/ollama
    container_name: demo_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  ollama-init:
    image: ollama/ollama
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama
      - ./models:/models
    entrypoint: ["/bin/sh", "-c"]
    command: >
    
      "
      echo 'Waiting for Ollama...' &&
      until ollama list > /dev/null 2>&1; do
        sleep 2
      done &&
      echo 'Ollama ready' &&
      (ollama list | grep -q 'llama3:8b' || ollama pull llama3:8b) &&
      (ollama list | grep -q 'llama3-8b-dpo2-sft1-nl' || ollama create llama3-8b-dpo2-sft1-nl -f /models/ft_nl/Modelfile) &&
      (ollama list | grep -q 'llama3-8b-dpo1-sft2-sql' || ollama create llama3-8b-dpo1-sft2-sql -f /models/ft_sql/Modelfile)
      "

  gateway:
    image: ghcr.io/alecicciarelli/demo_gateway_provenance:latest
    container_name: demo_gateway
    depends_on:
      ollama:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    ports:
      - "9005:9000"
    env_file:
      - .env
    environment:
      OLLAMA_HOST: http://ollama:11434
    

    # Explanation service config
    EXPLANATION_URL: http://explanation_app:5000
    EXPLANATION_ENDPOINT: /api/v1/aps/explanation/why
    EXPLANATION_BUCKET_DIR: /shared_bucket
    EXPLANATION_CSV_DELIMITER: ","
    EXPLANATION_KEEP_ROWNUM: "true"
    EXPLANATION_REQUEST_TIMEOUT: "500"

    volumes:
      - ./logs:/app/logs
      - ./faiss_index_tpch:/app/faiss_index_tpch
      - ./tpch_no_provsql:/app/tpch_no_provsql

      # Shared bucket for explanation service
      - ./bucket:/shared_bucket:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  explanation_app:
    image: ghcr.io/datagems-eosc/datagems-eosc/ap-explanation:v0.11.0
    container_name: explanation_app
    ports:
      - "5002:5000"
    volumes:
      - ./bucket:/mnt/s3:rw
    environment:
    - POSTGRES_HOST=postgres-provsql
    - POSTGRES_PORT=5432
    - POSTGRES_DB=mathe
    - POSTGRES_USER=provdemo
    - POSTGRES_PASSWORD=provdemo
    - POSTGRES_TIMESCALE_HOST=postgres-provsql
    - POSTGRES_TIMESCALE_PORT=5432
    - CELERY_BROKER_URL=redis://redis:6379/0
    - CELERY_RESULT_BACKEND=redis://redis:6379/0
    - UV_OFFLINE=1
    - LLM_API_BASE=https://172.16.59.5:32443/api
    - LLM_API_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6ImZjNWM2NmZhLTA1ZTYtNGQyMS1iMjc2LWUxNWFjMzRiODUzOSIsImp0aSI6ImZkM2NmYWRmLTRmOTEtNDA1NS1iZTk1LTEzZjg2NTllZDc3MSJ9.Df6Esb9c1FrwIrHfBoQqb6LwMxBweVQ6myCAyjDWVeU
    - LLM_API_MODEL=openai/kimi-k2.6
    - LLM_SSL_VERIFY=false   
    depends_on:
      postgres-provsql:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres-provsql:
    image: sotrx/postgres-provsql:v0.10.0
    container_name: postgres-provsql
    volumes:
      - wp4_poc_postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=provdemo
      - POSTGRES_PASSWORD=provdemo
      - POSTGRES_DB=mathe
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provdemo -d mathe"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: explanation_redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ollama_data:
  wp4_poc_postgres_data: