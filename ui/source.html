<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Source tuples</title>
  <link rel="stylesheet" href="/ui/styles.css?v=probability-colors-2">
  <script src="/ui/source.js" defer></script>
</head>
<body>
  <main class="csv-page">
    <h1 id="source-title">Source tuples</h1>
    <p id="source-description" role="status">Loading source table…</p>
    <nav class="source-pagination" aria-label="Table pages">
      <button id="previous" type="button">Previous</button>
      <span id="page-label"></span>
      <button id="next" type="button">Next</button>
      <button id="focus-source" type="button">Go to source tuple</button>

    <div class="table-wrap" id="source-table"></div>
  </main>
</body>
</html>
